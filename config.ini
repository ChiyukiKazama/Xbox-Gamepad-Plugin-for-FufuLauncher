[General]
Name = Xbox手柄自定义
Description = 支持自定义手柄地图快捷键和专用灵敏度系数；快键键可填View/Menu/A/B/X/Y/LB/RB/LT/RT/LS/RS/Up/Down/Left/Right/None（不区分大小写）
Developer = 风间千雪
File = XboxGamepadPlugin.dll
Version = 1.0.0

[MapBinding]
Name = 启用自定义地图按键
Type = bool
Value = 0

[MapButton]
Name = 地图快捷键
Type = string
Value = View

[GamepadSensitivityMultiplier]
Name = 手柄镜头灵敏度系数（1.0为原速）
Type = string
Value = 1.0

[GlobalInputSwitch]
Name = 全局手柄与键鼠热切换（实验性）
Type = bool
Value = 0
